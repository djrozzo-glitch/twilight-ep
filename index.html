<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151514">
<title>Twilight — Dubstep Breaker</title>
<meta name="description" content="Defend the decks with a bouncing dubplate in Twilight, a dubstep arcade game set beneath the railway arches of South London.">
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
</head>
<body>
<main class="cabinet">
  <header class="mast">
    <div class="brand"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span>SOUTH LONDON<br><strong>SOUND SYSTEM</strong></span></div>
    <div class="tools"><button id="sound" aria-pressed="true">Sound on</button><button id="pause" disabled>Pause</button></div>
    <div class="release">
      <div class="release-credit">
        <span class="release-label">Shifted</span>
        <span id="track" aria-live="polite">Twilight EP · lowQ</span>
      </div>
      <span class="best">BEST <strong id="best">00000</strong></span>
    </div>
  </header>
  <div class="hud" aria-label="Game status">
    <div><span>Wave</span><strong id="level">01 / 03</strong></div>
    <div><span>Score</span><strong id="score">00000</strong></div>
    <div class="pressure"><span>Pressure</span><div id="pressure" role="meter" aria-label="Pressure" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"></div></div>
    <div><span>Lives</span><strong id="lives" aria-label="3 lives">● ● ●</strong></div>
  </div>
  <section class="stage" aria-label="Playing field">
    <canvas id="field" width="640" height="570" aria-label="Bounce the record into the advancing crowd. Move the DJ with the touch strip below, mouse, or arrow keys."></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="kicker" id="kicker">BASS ARCADE</div>
        <h1 id="title">TWILIGHT<span>.</span></h1>
        <p id="message">Bounce the record into the crowd.<br>Keep three waves away from the decks.</p>
        <button class="action" id="action">Start game</button>
        <small id="hint">Touch strip · Mouse · Arrow keys</small>
      </div>
    </div>
    <div class="notice" id="notice" aria-live="polite"></div>
  </section>
  <button class="touch-strip" id="touch-strip" type="button" aria-label="Launch vinyl. Drag horizontally here to move the DJ." disabled>
    <span class="touch-grip" aria-hidden="true"></span>
    <span>Tap to launch <span class="touch-separator" aria-hidden="true">·</span> Drag to move</span>
    <span class="touch-grip" aria-hidden="true"></span>
  </button>
</main>
</body>
</html>
